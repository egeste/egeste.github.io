# ===== SEO & METADATA =====
logo: /assets/images/favicon.svg
image: /assets/images/og-banner.png

# OpenGraph defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
      author: Steve Regester
      image: /assets/images/og-banner.png
      type: website
      
  - scope:
      path: "index.md"
    values:
      priority: 1.0
      changefreq: weekly
      type: profile
      
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      type: article
      priority: 0.8
      changefreq: monthly
      
# SEO tag settings
twitter:
  username: egeste_
  card: summary_large_image 

