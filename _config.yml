# ===== SITE CONFIGURATION =====
site_config:
  primary_color: "#8b5cf6"
  contact_email: "info@egeste.net"
  geographic_region: "US-OR"
  city: "Portland"
  state: "Oregon"
  coordinates: "45.5152, -122.6784"

# ===== UI TEXT & LABELS =====
text:
  back_to_blog: "← Back to Blog"
  no_posts_message: "No posts yet. Check back soon!"
  skip_to_content: "Skip to main content"

navigation:
  home: "Home"
  about: "About"
  projects: "Work"
  blog: "Writing"
  resume: "Résumé"
  contact: "Contact"

# ===== ACCESSIBILITY =====
accessibility:
  focus_color: "#0066cc"

# ===== FONTS =====
fonts:
  preconnect:
    - "https://fonts.googleapis.com"
    - "https://fonts.gstatic.com"
  stylesheet: "https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Exo:wght@300;400;500;600;700&family=Audiowide&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
  primary: "Orbitron"
  secondary: "Exo"
  accent: "Audiowide"
  monospace: "JetBrains Mono"

# ===== ANIMATIONS =====
mesh_animation:
  max_nodes: 64
  max_distance: 256
  colors:
    user_created: "6, 182, 212"
    default: "139, 92, 246"

# ===== PWA MANIFEST =====
manifest:
  start_url: "/"
  display: "standalone"
  background_color: "#1a1a2e"
  orientation: "portrait-primary"
  scope: "/"
  dir: "ltr"
  categories: ["business", "productivity", "professional"]
  icons:
    - src: "/assets/images/favicon.svg"
      sizes: "any"
      type: "image/svg+xml"
      purpose: "any maskable"
    - src: "/assets/images/apple-touch-icon.png"
      sizes: "180x180"
      type: "image/png"
      purpose: "any"
    - src: "/assets/images/favicon-32x32.png"
      sizes: "32x32"
      type: "image/png"
      purpose: "any"
    - src: "/assets/images/favicon-16x16.png"
      sizes: "16x16"
      type: "image/png"
      purpose: "any"
  screenshots:
    - sizes: "1200x630"
      type: "image/png"
  related_applications: []
  prefer_related_applications: false
  edge_side_panel:
    preferred_width: 480
  launch_handler:
    client_mode: "navigate-existing"

# ===== SEO SETTINGS =====
seo:
  robots_content: "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  ai_content_declaration: "human-authored"
  schema_types: ["Person", "SoftwareEngineer"]
  
# ===== CONTENT & SEO =====
content_settings:
  categories: ["Engineering Leadership", "Technical Architecture", "Team Management", "Software Development"]
  target_audience: "technical-recruiters,engineering-leaders,startup-founders"
  content_type: "professional-portfolio"
  last_update: "2026-06"

# ===== EXIF PROCESSING CONFIGURATION =====
# Automated image metadata processing during build
exif_processing:
  enabled: true
  image_extensions: [jpg, jpeg, png, webp]
  exclude_paths: ['_site/', 'vendor/', 'node_modules/', '.git/']
  metadata:
    # Professional branding metadata added to all images
    creator: "Steve Regester"
    artist: "Steve Regester"
    copyright: "© 2026 Steve Regester"
    copyright_notice: "© 2026 Steve Regester"
    rights: "© 2026 Steve Regester"
    source: "https://egeste.net"
    credit: "egeste.net — Steve Regester"
    contact: "info@egeste.net"
    keywords: "Steve Regester, founding engineer, software engineer, Portland Oregon, full-stack, 0 to 1"
    subject: "Steve Regester — founding engineer and technical leader"
    title: "Steve Regester — Portfolio Asset"
    description: "Asset from Steve Regester's professional portfolio"

# ===== TECHNICAL CONFIGURATION =====
# Feed settings
feed:
  posts_limit: 20
  excerpt_only: false

# Sitemap settings
sitemap:
  priority: 1.0
  changefreq: monthly
  lastmod: true

# Performance
sass:
  style: compressed
  
liquid:
  error_mode: warn
  strict_filters: false
  strict_variables: false

# Theme Options
show_downloads: false


# Build settings
markdown: kramdown

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - context/